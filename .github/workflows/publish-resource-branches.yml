name: Trusted resource branch publisher

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify trusted publication logic
        run: python3 -m unittest discover -s tools -p test_branch_publish.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/branch_publish.py plan --output branch-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-plan
          path: branch-plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.head }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install Pillow==12.3.0
      - name: Build and validate exact branch commit
        env:
          SOURCE_BRANCH: ${{ matrix.name }}
          SOURCE_COMMIT: ${{ matrix.head }}
        run: python trusted/tools/branch_publish.py build --source source --output package --branch "$SOURCE_BRANCH" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-${{ matrix.id }}
          path: package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: incoming
      - name: Download the trusted plan to a fixed path
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: branch-plan
          path: trusted-plan
      - name: Publish immutable releases and replace branch catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/branch_publish.py publish --plan trusted-plan/branch-plan.json --artifacts incoming
