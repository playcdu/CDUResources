name: Resource pack checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned image dependency
        run: python -m pip install -r requirements.txt
      - name: Build, test and verify portable handoff
        run: python tools/check_artifacts.py
      - name: Check generated contracts and browser tools match source
        run: git diff --exit-code -- pack-source manifests CONTROL-EXPLORER.html LAYOUT-EDITOR.html
      - name: Upload resource pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quasar-gui-pack-${{ github.sha }}
          path: |
            deliverables/quasar-gui.zip
            deliverables/quasar-gui.zip.sha1
            deliverables/quasar-gui.zip.sha256
            deliverables/quasar-gui-layouts-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable artist kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quasar-gui-artist-kit-${{ github.sha }}
          path: |
            deliverables/quasar-gui-artist-kit.zip
            deliverables/quasar-gui-artist-kit.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ github.sha }}
          path: deliverables/checksums.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}
          path: |
            evidence/ci-verification.json
            evidence/artist-kit-roundtrip.json
            evidence/pack-tests/test-results.json
            evidence/pack-tests/texture-only-exercise.json
          if-no-files-found: warn
          retention-days: 30
